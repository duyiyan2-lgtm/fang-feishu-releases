<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>仿飞书工作台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      background: #0B1220;
      color: #fff;
      user-select: none;
      -webkit-app-region: drag;
    }
    .wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(51, 112, 255, 0.35), transparent 55%),
        radial-gradient(ellipse 50% 40% at 80% 100%, rgba(99, 102, 241, 0.2), transparent 50%),
        linear-gradient(160deg, #0B1220 0%, #111827 50%, #0F172A 100%);
    }
    .glow {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(51,112,255,0.45), transparent 70%);
      filter: blur(8px);
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.92); opacity: 0.7; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    .logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      background: linear-gradient(145deg, #3370FF, #1A3A8F);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 40px rgba(51, 112, 255, 0.45), inset 0 1px 0 rgba(255,255,255,0.25);
      position: relative;
      z-index: 1;
      animation: pop 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.7) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .logo svg { width: 48px; height: 48px; }
    h1 {
      margin-top: 28px;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: 0.04em;
      position: relative;
      z-index: 1;
      animation: fade 0.8s 0.15s both;
    }
    p.sub {
      margin-top: 8px;
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      position: relative;
      z-index: 1;
      animation: fade 0.8s 0.25s both;
    }
    @keyframes fade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .bar {
      margin-top: 36px;
      width: 180px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
      overflow: hidden;
      position: relative;
      z-index: 1;
      animation: fade 0.8s 0.35s both;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: inherit;
      background: linear-gradient(90deg, #3370FF, #60A5FA, #3370FF);
      background-size: 200% 100%;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    .ver {
      position: absolute;
      bottom: 20px;
      font-size: 11px;
      color: rgba(255,255,255,0.28);
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="glow"></div>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M12 14a4 4 0 014-4h8v10H12V14z" fill="white" opacity=".95"/>
        <path d="M12 22h12v8H12v-8z" fill="white" opacity=".75"/>
        <path d="M12 32h8v6a4 4 0 01-4 4h-4v-10z" fill="white" opacity=".55"/>
        <path d="M26 10h10a4 4 0 014 4v4H26V10z" fill="white" opacity=".9"/>
        <path d="M26 20h14v8H26v-8z" fill="white" opacity=".7"/>
        <path d="M26 30h14v4a4 4 0 01-4 4H26v-8z" fill="white" opacity=".5"/>
      </svg>
    </div>
    <h1>仿飞书工作台</h1>
    <p class="sub">正在启动协作环境…</p>
    <div class="bar"><i></i></div>
    <div class="ver">PC Client</div>
  </div>
</body>
</html>
