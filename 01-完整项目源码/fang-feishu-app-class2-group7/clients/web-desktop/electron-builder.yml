appId: com.fangfeishu.workspace
productName: 仿飞书工作台
copyright: Copyright © 2026 Class2 Group7
asar: true
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - electron/**
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: FangFeishu-PC-${version}-${arch}.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 仿飞书工作台
portable:
  artifactName: FangFeishu-PC-Portable-${version}.${ext}
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity
  artifactName: FangFeishu-Mac-${version}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Office
  artifactName: FangFeishu-Linux-${version}.${ext}